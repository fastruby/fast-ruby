name: Benchmarks

# Always runs, so the benchmarks-ok check at the end always reports and can be
# required. The changes job decides whether there is anything to benchmark.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.pick.outputs.run }}
      files: ${{ steps.pick.outputs.files }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pick benchmarks
        id: pick
        # A pull_request checks out a merge commit: HEAD^1 is the base.
        run: .github/scripts/pick-benchmarks.sh "${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}"

  # Every benchmark has the same shape (see lint-benchmarks.rb). Reads the
  # files without running them, on the newest Ruby: the lint needs Prism.
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Lint benchmarks
        run: docker compose run --rm -T --entrypoint ruby ruby_4.0 .github/scripts/lint-benchmarks.rb

  # Waits for the lint: if it fails, the PR cannot merge, so the benchmark
  # jobs would only hold the org's job slots for nothing.
  rake:
    name: rake (${{ matrix.ruby }}${{ matrix.variant && format('+{0}', matrix.variant) || '' }})
    needs: [changes, lint]
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Service names from compose.yaml
        ruby: [
          'ruby_head', 'ruby_4.0', 'ruby_3.4', 'ruby_3.3', 'ruby_3.2', 'ruby_3.1',
          'ruby_3.0', 'ruby_2.7', 'ruby_2.6', 'ruby_2.5', 'ruby_2.4', 'ruby_2.3',
          'ruby_2.2', 'ruby_2.1',
          'jruby_head', 'jruby_9.1',
          'truffleruby_head', 'truffleruby_22'
        ]
        # '' is the plain Ruby. Each include below overwrites it, so GitHub
        # adds it as a separate job instead of merging it into the plain one.
        variant: ['']
        include:
          - { ruby: ruby_3.1, variant: yjit, flags: --yjit }
          - { ruby: ruby_3.2, variant: yjit, flags: --yjit }
          - { ruby: ruby_3.3, variant: yjit, flags: --yjit }
          - { ruby: ruby_3.4, variant: yjit, flags: --yjit }
          - { ruby: ruby_4.0, variant: yjit, flags: --yjit }
          - { ruby: ruby_head, variant: yjit, flags: --yjit }
          - { ruby: ruby_4.0, variant: zjit, flags: --zjit }
          - { ruby: ruby_head, variant: zjit, flags: --zjit }

    # Read by docker/run-benchmarks.sh and docker/collect_results.rb.
    env:
      RUBY_VARIANT: ${{ matrix.variant }}
      RUBY_VARIANT_FLAGS: ${{ matrix.flags }}
      RESULTS_DIR: results
      RESULTS_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RESULTS_PR: ${{ github.event.pull_request.number }}
      RESULTS_LABEL: ${{ matrix.ruby }}${{ matrix.variant && format('+{0}', matrix.variant) || '' }}

    steps:
      # Plain Rubies only: shared reports do not record the Ruby or its flags,
      # so variant runs would be indistinguishable on ips.fastruby.io.
      - name: Set Share Env
        if: github.ref_name == 'main' && matrix.variant == ''
        run: |
          echo "SHARE=1" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Run benchmarks on ${{ env.RESULTS_LABEL }}
        env:
          FILES: ${{ needs.changes.outputs.files }}
        run: .github/scripts/run-benchmarks.sh ${{ matrix.ruby }}
      - name: Report failed benchmarks
        if: failure()
        run: .github/scripts/report-failures.sh benchmarks.log ${{ env.RESULTS_LABEL }}
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ env.RESULTS_LABEL }}
          path: results/
          if-no-files-found: warn

  # Builds the results site from every job's results, also when some jobs
  # failed, so a PR gets a preview (the site-preview artifact, named outside
  # the results-* pattern so a re-run never downloads it). Skipped when the
  # benchmark jobs did not run (a lint failure). Only a push to
  # main where every job passed publishes it, so a partial run never replaces
  # the live site. Not required: a Pages problem never blocks a merge.
  site:
    needs: [changes, rake]
    if: ${{ !cancelled() && needs.changes.outputs.run == 'true' && needs.rake.result != 'skipped' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results/
          merge-multiple: true
      - name: Build the results site
        # A failed benchmark job leaves no result file, like a benchmark that needs a newer Ruby, so the page says missing results may be crashes.
        env:
          RESULTS_INCOMPLETE: ${{ needs.rake.result != 'success' && '1' || '' }}
        run: docker compose run --rm -T -e RESULTS_INCOMPLETE --entrypoint ruby ruby_4.0 script/build_results_site.rb results _site
      - name: Upload the site preview
        id: preview
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site/
          # A re-run replaces the earlier attempt's preview.
          overwrite: true
      # A one-click link on the run's Summary page; it needs no extra permissions, so it works for PRs from forks too.
      - name: Link the site preview in the run summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          {
            echo "### Results site preview"
            echo ""
            echo "[Download the site preview]($PREVIEW_URL) (a zip, needs a GitHub login), unzip it and open \`index.html\` in a browser."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref_name == 'main' && needs.rake.result == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    needs: [rake, site]
    if: github.event_name == 'push' && github.ref_name == 'main' && needs.rake.result == 'success' && needs.site.result == 'success'
    runs-on: ubuntu-latest
    # Only this job can publish; the rest of the workflow keeps the default
    # token permissions.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; a newer merge waits instead of cancelling one that
    # is halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      # Runs can finish out of order, so an older run must not put its results back over a newer one.
      # When main moved on, ask pick-benchmarks.sh (the same rule CI uses) whether the newer commits run benchmarks.
      # If they do, their own run deploys newer results; if not (a README-only merge), this run's results are still the newest.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check no newer run on main will deploy
        id: newest
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GITHUB_EVENT_NAME=push GITHUB_OUTPUT=newer.txt .github/scripts/pick-benchmarks.sh "$GITHUB_SHA"
          if grep -q '^run=true' newer.txt; then
            echo "main moved on and its newer commits run benchmarks, so their run deploys; skipping."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved on, but nothing since this run affects benchmarks; deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/deploy-pages@v5

  # The check to require on main. Passes when every benchmark job passed, or
  # when there was nothing to benchmark.
  benchmarks-ok:
    needs: [changes, lint, rake]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check the benchmark jobs
        run: .github/scripts/check-benchmarks.sh ${{ needs.changes.result }} ${{ needs.lint.result }} ${{ needs.rake.result }}
